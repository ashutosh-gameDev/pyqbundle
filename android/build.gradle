// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP's own default build-tools pick for compileSdk 35 is 34.0.0; this
// machine's SDK only has 36.0.0 installed. Set here (not per-module) so it
// also covers capacitor-cordova-android-plugins/build.gradle, which
// `cap sync` regenerates and never sets buildToolsVersion itself.
subprojects {
    afterEvaluate { proj ->
        if (proj.hasProperty("android")) {
            proj.android.buildToolsVersion "36.0.0"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
