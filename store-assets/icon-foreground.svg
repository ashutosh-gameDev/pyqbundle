<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- Transparent background - this is the adaptive icon's FOREGROUND layer
       only. Kept well inside the ~66% "safe zone" every launcher mask
